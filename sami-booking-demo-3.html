<!doctype html>
<html lang="de">
<head>

<title>Sami Haircut – Online Termin</title>

<!--
  SAMI HAIRCUT – Booking Demo (321tadaa)
  ---------------------------------------
  Demo mode: all data lives in this browser (localStorage).
  Open the file in two tabs (one "Termin buchen", one "Team") – they sync live.

  Later: Google Sheets backend via Apps Script Web App.
  Only load() / save() and createBooking() need to call the API instead.
  Suggested sheets: Bookings | Blocks | Barbers | Services | Settings
-->
<style>
:root{--bg:#111;--card:#1a1a1a;--card2:#222;--line:#2e2e2e;--tx:#f2ede4;--mut:#9a958c;--gold:#c9a45c;--gold2:#e2c48a;--ok:#5fb37a;--bad:#d0645a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,sans-serif}
h1,h2,h3,.brand b,.oswald{font-family:Oswald,sans-serif;letter-spacing:.04em;font-weight:600}
h2{margin:0 0 6px;font-size:24px}h3{margin:0 0 12px;font-size:20px}
a{color:var(--gold2)}
.mut{color:var(--mut)}
.top{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 16px;background:#0b0b0bf0;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:38px;height:38px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-family:Oswald;color:var(--gold);font-size:20px}
.brand b{font-size:18px}.brand small{display:block;color:var(--mut);font-size:12px}
nav{display:flex;gap:2px;background:var(--card);padding:4px;border-radius:999px}
nav button{background:none;border:0;color:var(--mut);padding:7px 12px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
nav button.on{background:var(--gold);color:#111;font-weight:600}
.demo{background:#2a2316;color:var(--gold2);font-size:12px;text-align:center;padding:6px 16px}
main{max-width:1000px;margin:0 auto;padding:20px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.narrow{max-width:440px;margin:20px auto}
.steps{display:flex;gap:6px;margin:4px 0 18px}
.steps div{flex:1;height:4px;border-radius:4px;background:var(--line)}.steps div.on{background:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--tx);cursor:pointer;font-family:inherit}
.chip:hover{border-color:var(--gold)}
.back{background:none;border:0;color:var(--mut);cursor:pointer;font:inherit;padding:0;margin-bottom:10px}
.cat{font-family:Oswald;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;font-size:13px;margin:18px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--tx);font:inherit;cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--gold);transform:translateY(-1px)}
.opt small{display:block;color:var(--mut);font-size:13px}
.opt.sel{border-color:var(--gold);background:#2a2316}
.tick{display:inline-grid;place-items:center;width:20px;height:20px;border:1.5px solid var(--line);border-radius:6px;margin-right:10px;vertical-align:-4px;font-size:13px;color:#111}
.opt.sel .tick{background:var(--gold);border-color:var(--gold)}
.bar{position:sticky;bottom:12px;margin-top:20px;display:flex;gap:12px;align-items:center;justify-content:space-between;background:#1f1a12f2;border:1px solid var(--gold);border-radius:14px;padding:12px 14px;backdrop-filter:blur(6px)}
.bar small{display:block;color:var(--mut);font-size:12px}
.svlist{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:9px;padding:10px;margin:-6px 0 12px}.svlist label{margin:0 0 6px}
.price{font-family:Oswald;font-size:18px;color:var(--gold2);white-space:nowrap}
.barber{display:flex;gap:12px;align-items:center}
.av{width:52px;height:52px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:Oswald;font-size:22px;color:#111;background:var(--c)}
.opt.any{border-color:var(--gold);background:linear-gradient(135deg,#2a2316,#1a1a1a)}
.next{font-size:12px;color:var(--ok);margin-top:3px}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;scrollbar-width:thin}
.day{flex:none;width:64px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 0;color:var(--tx);font:inherit;cursor:pointer;text-align:center}
.day small{display:block;font-size:11px;color:var(--mut)}.day b{display:block;font-family:Oswald;font-size:22px}
.day i{display:block;font-style:normal;font-size:10px;color:var(--ok);margin-top:2px}
.day.on{background:var(--gold);color:#111;border-color:var(--gold)}.day.on small,.day.on i{color:#111}
.day:disabled{opacity:.35;cursor:not-allowed}
.tgrp{font-size:12px;color:var(--mut);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.06em}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.time{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:9px 0;color:var(--tx);font:500 14px Inter;cursor:pointer}
.time:hover{border-color:var(--gold);color:var(--gold2)}
label{display:block;font-size:13px;color:var(--mut);margin:0 0 12px}
input,select,textarea{display:block;width:100%;margin-top:5px;background:#0e0e0e;border:1px solid var(--line);border-radius:9px;color:var(--tx);padding:10px 12px;font:15px Inter}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
.check{display:flex;gap:10px;align-items:flex-start;color:var(--tx)}.check input{width:auto;margin-top:3px}
a.btn{display:inline-block;text-decoration:none}
.btn{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px 14px;font:500 14px Inter;cursor:pointer}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#111;font-weight:600}
.btn.ok{border-color:var(--ok);color:var(--ok)}.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.ghost{background:none}.w{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 8px}
.sum{background:var(--card2);border-radius:12px;padding:14px;margin-bottom:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}.kv span{color:var(--mut)}
.code{font-family:Oswald;font-size:34px;color:var(--gold);letter-spacing:.12em;text-align:center;margin:8px 0}
.hint{font-size:12px;color:var(--mut);background:#0e0e0e;border:1px dashed var(--line);border-radius:9px;padding:8px 10px}
.ok-ic{width:56px;height:56px;border-radius:50%;background:var(--ok);color:#111;display:grid;place-items:center;font-size:28px;margin:0 auto 8px}
/* team */
.thead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.datenav{display:flex;gap:6px;align-items:center}.datenav input{width:auto;margin:0;padding:7px 10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-family:Oswald;font-size:22px;color:var(--gold2)}.stat small{color:var(--mut);font-size:12px}
.tl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.tlin{padding:8px 8px 12px}
.tlhead{display:flex;gap:6px;padding-left:46px;margin-bottom:8px}
.colh{flex:1;min-width:120px;text-align:center;font-family:Oswald;letter-spacing:.05em;padding:6px;border-radius:8px;background:var(--card2);border-bottom:3px solid var(--c)}
.tlbody{position:relative}
.hl{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.hl span{position:absolute;left:0;top:-8px;font-size:11px;color:var(--mut);background:var(--card);padding-right:4px}
.now{position:absolute;left:40px;right:0;border-top:2px solid var(--bad);z-index:3}
.cols{position:absolute;left:46px;right:0;top:0;bottom:0;display:flex;gap:6px}
.col{flex:1;min-width:120px;position:relative}
.offday{position:absolute;inset:0;border-radius:8px;background:repeating-linear-gradient(45deg,#1d1d1d 0 8px,#181818 8px 16px);display:grid;place-items:center;color:var(--mut);font-family:Oswald;letter-spacing:.1em}
.ev{position:absolute;left:2px;right:2px;background:color-mix(in srgb,var(--c) 24%,#1a1a1a);border-left:3px solid var(--c);border-radius:6px;padding:3px 6px;font-size:12px;overflow:hidden;cursor:pointer;z-index:2;line-height:1.3}
.ev:hover{filter:brightness(1.25)}
.ev b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ev span{color:#c9c3b8;white-space:nowrap}
.ev.st-done{opacity:.5}.ev.st-done b::before{content:"✓ "}
.ev.st-noshow{border-left-color:var(--bad);background:#2a1716}.ev.st-noshow b{text-decoration:line-through}
.ev.blk{--c:#555;background:repeating-linear-gradient(45deg,#262626 0 6px,#1f1f1f 6px 12px);color:var(--mut)}
.walk{font-size:10px;background:#0006;border-radius:4px;padding:0 4px;margin-left:4px}
.list{margin-top:18px}
.li{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;background:var(--card)}
.li:hover{border-color:var(--gold)}.li time{font-family:Oswald;color:var(--gold2);min-width:96px}
.modal{position:fixed;inset:0;background:#000b;z-index:20;display:grid;place-items:center;padding:16px}
.modal.hidden{display:none}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--gold);color:#111;font-weight:600;padding:10px 18px;border-radius:999px;transition:.3s;z-index:30;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%)}
.foot{text-align:center;color:var(--mut);font-size:12px;margin-top:40px}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}nav button{padding:7px 9px}.brand small{display:none}}
</style>

<body>
<header class="top">
  <div class="brand"><span class="logo">S</span><div><b>SAMI HAIRCUT</b><small>Barbershop · Freiberg a.N.</small></div></div>
  <nav>
    <button data-view="book">Termin buchen</button>
    <button data-view="mine">Meine Buchung</button>
    <button data-view="team">Team</button>
  </nav>
</header>
<div class="demo">DEMO · Daten nur lokal in diesem Browser · Platzhalter-Namen · <a href="#" id="reset">Demo zurücksetzen</a></div>
<main id="app"></main>
<div id="modal" class="modal hidden"><div class="mbox" id="mbox"></div></div>
<div id="toast" class="toast"></div>

<script>
/* ================= CONFIG ================= */
const CFG={
  phone:'07141 4877 779', address:'Benninger Str. 9, 71691 Freiberg am Neckar',
  step:15,          // slot grid in minutes
  leadMin:60,       // earliest online booking: now + 60 min
  horizonDays:21,   // bookable days ahead
  cancelHours:2,    // online cancellation until 2 h before
  // 0=So … 6=Sa : [open, close] in minutes
  hours:{0:null,1:[540,1140],2:[540,1140],3:[540,1140],4:[540,1140],5:[540,1140],6:[480,960]}
};
const BARBERS=[
  {id:'b1',name:'Karim',nick:'The Blade',spec:'Skin Fades & scharfe Konturen',color:'#c9a45c',off:[1],pin:'1111'},
  {id:'b2',name:'Luca', nick:'Mr. Taper',spec:'Klassiker, Taper & Scherenschnitt',color:'#5fa8a0',off:[2],pin:'2222'},
  {id:'b3',name:'Emre', nick:'Razor',    spec:'Bart, Nassrasur & Heißtuch',color:'#d07a62',off:[3],pin:'3333'},
  {id:'b4',name:'Jonas',nick:'Freestyle',spec:'Hair Designs, Trends & Kids',color:'#8f84d6',off:[4],pin:'4444'}
];
const OWNER_PIN='0000';
const SERVICES=[
  {id:'hs',      cat:'Haarschnitte',   name:'Herrenhaarschnitt',dur:30},
  {id:'fade',    cat:'Haarschnitte',   name:'Fade Cut (Skin / Low / Mid / High / Taper)',dur:40},
  {id:'mas',     cat:'Haarschnitte',   name:'Maschinenhaarschnitt',dur:20},
  {id:'kid',     cat:'Haarschnitte',   name:'Kinderhaarschnitt (bis 12 J.)',dur:25},
  {id:'bart',    cat:'Bart & Grooming',name:'Bart trimmen & Konturen',dur:20},
  {id:'nass',    cat:'Bart & Grooming',name:'Klassische Nassrasur mit Heißschaum',dur:30},
  {id:'bstyle',  cat:'Bart & Grooming',name:'Komplettes Bartstyling',dur:30},
  {id:'fadebart',cat:'Kombi',          name:'Fade Cut + Bartkonturen',dur:50},
  {id:'wsb',     cat:'Kombi',          name:'Waschen + Haarschnitt + Bart',dur:60},
  {id:'komplett',cat:'Kombi',          name:'Komplett Styling (Haare + Bart + Finish)',dur:75},
  {id:'brauen',  cat:'Weitere',        name:'Augenbrauen formen',dur:10}
];
const STATUS={confirmed:'Bestätigt',done:'Erledigt',noshow:'Nicht erschienen',cancelled:'Storniert'};

/* ================= HELPERS ================= */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const DN=['So','Mo','Di','Mi','Do','Fr','Sa'];
const DNL=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MN=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const today=()=>ds(new Date());
const nowM=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const B=id=>BARBERS.find(b=>b.id===id);
const SV=id=>SERVICES.find(s=>s.id===id);
// several services in one booking → one combined appointment
const svOf=ids=>({ids:[...ids],name:ids.map(i=>SV(i).name).join(' + '),dur:ids.reduce((a,i)=>a+SV(i).dur,0)});
const BSV=x=>svOf(x.services||[x.service]);
const fmtDate=s=>{const d=parseD(s);return DNL[d.getDay()]+', '+d.getDate()+'. '+MN[d.getMonth()]};
const fmtShort=s=>{const d=parseD(s);return DN[d.getDay()]+' '+d.getDate()+'.'+(d.getMonth()+1)+'.'};
const uid=()=>Math.random().toString(36).slice(2,10);
const mkCode=()=>'SH-'+Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
const digits=s=>String(s||'').replace(/\D/g,'');
const minsUntil=(date,start)=>(parseD(date).getTime()+start*60000-Date.now())/60000;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2600)}
function modal(h){$('#mbox').innerHTML=h;$('#modal').classList.remove('hidden')}
function closeM(){$('#modal').classList.add('hidden')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});

/* ================= DATA (demo: localStorage → later: Google Sheets) ================= */
const KEY='sami_booking_demo_v2';
let S;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const j=localStorage.getItem(KEY);if(j){S=JSON.parse(j);return}}catch(e){}seed();save()}
function mk(o){return Object.assign({id:uid(),code:mkCode(),status:'confirmed',created:Date.now(),email:'',note:'',source:'online'},o)}
function seed(){
  S={bookings:[],blocks:[],last:null};
  let r=11;const rnd=()=>(r=(r*9301+49297)%233280)/233280;
  const names=['Ali K.','Marco R.','Tim B.','Yusuf A.','Daniel S.','Nikola P.','Felix W.','Hakan Ö.','Leon M.','Stefan H.','Kerem D.','Max L.','Andrei P.','Giuseppe F.','Paul T.','Björn G.','Tobi N.'];
  for(let i=0;i<10;i++){
    const d=addD(new Date(),i),date=ds(d),h=CFG.hours[d.getDay()];if(!h)continue;
    BARBERS.forEach((b,k)=>{
      if(b.off.includes(d.getDay()))return;
      if(d.getDay()!==6)S.blocks.push({id:uid(),barberId:b.id,date,from:750+k*30,to:780+k*30,reason:'Mittagspause'});
      let t=h[0];
      while(t<h[1]-20){
        if(rnd()<0.42){
          const a=SERVICES[Math.floor(rnd()*7)].id,sv=svOf(rnd()<.3&&a!=='bart'?[a,'bart']:[a]);
          if(isFree(b.id,date,t,sv.dur)){
            const bk=mk({barberId:b.id,date,start:t,services:sv.ids,dur:sv.dur,name:names[Math.floor(rnd()*names.length)],phone:'0171 '+Math.floor(1000000+rnd()*8999999),source:rnd()<.8?'online':'walkin'});
            if(i===0&&t+sv.dur<nowM())bk.status=rnd()<.9?'done':'noshow';
            S.bookings.push(bk);t+=sv.dur;
          }else t+=15;
        }else t+=15*(1+Math.floor(rnd()*3));
        t=Math.ceil(t/15)*15;
      }
    });
  }
  return S;
}

/* ================= AVAILABILITY ================= */
function works(bid,date){const d=parseD(date),h=CFG.hours[d.getDay()];return h&&!B(bid).off.includes(d.getDay())?h:null}
function busy(bid,date,ign){
  const a=S.bookings.filter(x=>x.barberId===bid&&x.date===date&&x.status!=='cancelled'&&x.id!==ign).map(x=>[x.start,x.start+x.dur]);
  S.blocks.filter(x=>x.barberId===bid&&x.date===date).forEach(x=>a.push([x.from,x.to]));return a;
}
function isFree(bid,date,s,dur,ign){const h=works(bid,date);if(!h||s<h[0]||s+dur>h[1])return false;return busy(bid,date,ign).every(([a,b])=>s+dur<=a||s>=b)}
function teamSlots(bid,date,dur,ign){const h=works(bid,date),o=[];if(!h)return o;for(let s=h[0];s+dur<=h[1];s+=CFG.step)if(isFree(bid,date,s,dur,ign))o.push(s);return o}
function slots(bid,date,dur){const min=date===today()?nowM()+CFG.leadMin:-1;if(date<today())return[];return teamSlots(bid,date,dur).filter(s=>s>=min)}
function slotsFor(sel,date,dur){
  if(sel!=='any')return slots(sel,date,dur);
  const set=new Set();BARBERS.forEach(b=>slots(b.id,date,dur).forEach(s=>set.add(s)));return[...set].sort((a,b)=>a-b);
}
function dayLoad(bid,date){return busy(bid,date).reduce((a,[s,e])=>a+e-s,0)}
function pickBarber(date,s,dur){const c=BARBERS.filter(b=>isFree(b.id,date,s,dur));c.sort((a,b)=>dayLoad(a.id,date)-dayLoad(b.id,date));return c[0]}
function nextFree(sel,dur){for(let i=0;i<CFG.horizonDays;i++){const date=ds(addD(new Date(),i)),s=slotsFor(sel,date,dur);if(s.length)return{date,time:s[0]}}return null}

/* ================= CLIENT BOOKING ================= */
let view='book';
let F={step:1};
function go(step){F.step=step;render();scrollTo(0,0)}
function vBook(){
  const st=`<div class="steps">${[1,2,3,4].map(i=>`<div class="${F.step>=i?'on':''}"></div>`).join('')}</div>`;
  const sv=F.services&&F.services.length&&svOf(F.services);
  const chips=`<div class="chips">${sv?`<button class="chip" onclick="go(1)">✂ ${esc(sv.name)}</button>`:''}${F.step>2&&F.barber?`<button class="chip" onclick="go(2)">👤 ${F.barber==='any'?'Erster freier Barber':B(F.barber).name}</button>`:''}${F.step>3&&F.time!=null?`<button class="chip" onclick="go(3)">🕑 ${fmtShort(F.date)} · ${fm(F.time)}</button>`:''}</div>`;
  if(F.step===5)return vDone();
  const body=[null,vStep1,vStep2,vStep3,vStep4][F.step]();
  return st+chips+body;
}
function vStep1(){
  const cats=[...new Set(SERVICES.map(s=>s.cat))],sel=F.services||[];
  return `<h2>Was dürfen wir für dich tun?</h2><p class="mut">Wähle eine oder mehrere Leistungen – z. B. Haarschnitt + Bart.</p>`+
  cats.map(c=>`<div class="cat">${c}</div><div class="grid">${SERVICES.filter(s=>s.cat===c).map(s=>
    `<button class="opt ${sel.includes(s.id)?'sel':''}" onclick="toggleSv('${s.id}')"><div><span class="tick">${sel.includes(s.id)?'✓':''}</span>${esc(s.name)}</div><span class="price">${s.dur}′</span></button>`).join('')}</div>`).join('')+

function submitBooking(e){
  e.preventDefault();

const isOwner=()=>T.user==='owner';
const scope=()=>isOwner()?BARBERS:[B(T.user)];

function vTeam(){
  if(!T.user)return vLogin();
  const list=scope(),d=parseD(T.date),h=CFG.hours[d.getDay()];
  const who=isOwner()?{name:'Sami',nick:'Inhaber',color:'#c9a45c'}:B(T.user);

  const onl=bks.filter(x=>x.source==='online').length;
  let cap=0,used=0;list.forEach(b=>{const w=works(b.id,T.date);if(w){cap+=w[1]-w[0];used+=dayLoad(b.id,T.date)}});
  const free30=list.reduce((a,b)=>a+teamSlots(b.id,T.date,30).filter(s=>s%30===0).length,0);
  let html=`<div class="thead"><div class="barber"><div class="av" style="--c:${who.color}">${who.name[0]}</div><div><h2 style="margin:0">Hallo ${who.name}</h2><span class="mut">${isOwner()?'Übersicht aller Barber':'„'+who.nick+'“ · deine Termine'}</span></div></div>

function timeline(list,h){
  const PX=1.5,H=(h[1]-h[0])*PX;
  let lines='';for(let m=h[0];m<=h[1];m+=60)lines+=`<div class="hl" style="top:${(m-h[0])*PX}px"><span>${fm(m)}</span></div>`;
  const n=nowM(),now=T.date===today()&&n>h[0]&&n<h[1]?`<div class="now" style="top:${(n-h[0])*PX}px"></div>`:'';
  const cols=list.map(b=>{
    if(!works(b.id,T.date))return `<div class="col"><div class="offday">FREI</div></div>`;
    let inner='';
    S.blocks.filter(x=>x.barberId===b.id&&x.date===T.date).forEach(x=>inner+=`<div class="ev blk" style="top:${(x.from-h[0])*PX}px;height:${(x.to-x.from)*PX-2}px" onclick="delBlock('${x.id}')"><b>${esc(x.reason)}</b><span>${fm(x.from)}–${fm(x.to)}</span></div>`);
    S.bookings.filter(x=>x.barberId===b.id&&x.date===T.date&&x.status!=='cancelled').forEach(x=>{const sv=BSV(x);
      inner+=`<div class="ev st-${x.status}" style="top:${(x.start-h[0])*PX}px;height:${x.dur*PX-2}px;--c:${b.color}" onclick="openBk('${x.id}')"><b>${fm(x.start)} ${esc(x.name||'Walk-in')}${x.source==='walkin'?'<span class="walk">W</span>':''}</b><span>${esc(sv.name)}</span></div>`});
    return `<div class="col">${inner}</div>`;
  }).join('');
  const minW=46+list.length*126;
  return `<div class="tl"><div class="tlin" style="min-width:${minW}px"><div class="tlhead">${list.map(b=>`<div class="colh" style="--c:${b.color}">${b.name}</div>`).join('')}</div>
   <div class="tlbody" style="height:${H}px">${lines}${now}<div class="cols">${cols}</div></div></div></div>`;
}
function upcoming(){
  const now=Date.now();

   <label>Leistungen <span class="mut">(${sv.dur} Min.)</span></label><div class="svlist">${SERVICES.map(s=>`<label class="check"><input type="checkbox" ${W.services.includes(s.id)?'checked':''} onchange="W.services=this.checked?[...W.services,'${s.id}']:W.services.filter(x=>x!=='${s.id}');drawWalk()"> <span>${esc(s.name)} (${s.dur}′)</span></label>`).join('')}</div>
   <label>Uhrzeit<select id="wT">${opts.length?opts.map(s=>`<option value="${s}">${fm(s)}</option>`).join(''):'<option value="">– kein freier Slot –</option>'}</select></label>
   <label>Name (optional)<input id="wN" value="${esc(W.name)}"></label><label>Telefon (optional)<input id="wP" type="tel" value="${esc(W.phone)}"></label>
   <div class="btns"><button class="btn gold" onclick="doWalk()">Eintragen</button><button class="btn ghost" onclick="closeM()">Abbrechen</button></div>`);
}
function doWalk(){keepW();const v=$('#wT').value;if(v==='')return toast('Kein freier Slot');const sv=svOf(W.services);
  S.bookings.push(mk({barberId:W.barber,date:T.date,start:+v,services:sv.ids,dur:sv.dur,name:W.name.trim()||'Walk-in',phone:W.phone.trim(),source:'walkin'}));save();closeM();render();toast('Eingetragen')}
var K={};
function blockT(){K={barber:isOwner()?BARBERS[0].id:T.user,reason:'Pause'};drawBlock()}
function drawBlock(){
  const w=works(K.barber,T.date);
  if(!w)return modal(`<h3>Zeit blocken</h3>${barberPick('K','drawBlock')}<p class="mut">An diesem Tag nicht im Dienst.</p><button class="btn ghost w" onclick="closeM()">Schließen</button>`);
  const t=[];for(let m=w[0];m<=w[1];m+=15)t.push(m);
  modal(`<h3>Zeit blocken</h3><p class="mut" style="margin-top:-6px">${fmtDate(T.date)}</p>${barberPick('K','drawBlock')}
   <label>Grund<select id="kR">${['Pause','Frei / Urlaub','Privater Termin','Schulung','Krank'].map(r=>`<option>${r}</option>`).join('')}</select></label>
   <div style="display:flex;gap:10px"><label style="flex:1">Von<select id="kF">${t.slice(0,-1).map(m=>`<option value="${m}">${fm(m)}</option>`).join('')}</select></label>
   <label style="flex:1">Bis<select id="kT">${t.slice(1).map((m,i)=>`<option value="${m}" ${i===1?'selected':''}>${fm(m)}</option>`).join('')}</select></label></div>
   <label class="check"><input id="kA" type="checkbox"> <span>Ganzer Tag</span></label>
   <div class="btns"><button class="btn gold" onclick="doBlock()">Blocken</button><button class="btn ghost" onclick="closeM()">Abbrechen</button></div>`);
}
function doBlock(){
  const w=works(K.barber,T.date);let f=+$('#kF').value,t=+$('#kT').value;if($('#kA').checked){f=w[0];t=w[1]}
  if(t<=f)return toast('Endzeit muss nach Startzeit liegen');
  const c=S.bookings.filter(x=>x.barberId===K.barber&&x.date===T.date&&x.status!=='cancelled'&&x.start<t&&x.start+x.dur>f);
  if(c.length)return toast(`${c.length} Termin(e) im Zeitraum – bitte erst verschieben`);
  S.blocks.push({id:uid(),barberId:K.barber,date:T.date,from:f,to:t,reason:$('#kR').value});save();closeM();render();toast('Zeit blockiert');
}
function delBlock(id){if(!confirm('Blockierung entfernen?'))return;S.blocks=S.blocks.filter(x=>x.id!==id);save();render()}

/* ================= APP ================= */
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===view));
  $('#app').innerHTML=(view==='book'?vBook():view==='mine'?vMine():vTeam())+
   `<div class="foot">Sami Haircut · ${CFG.address} · <a href="tel:${digits(CFG.phone)}">${CFG.phone}</a><br>Mo–Fr 09:00–19:00 · Sa 08:00–16:00</div>`;
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;if(view==='mine')Q={tried:false,res:null};closeM();render()});
$('#reset').onclick=e=>{e.preventDefault();if(!confirm('Alle Demo-Daten neu erzeugen?'))return;seed();save();F={step:1};T.date=today();render();toast('Demo zurückgesetzt')};
window.addEventListener('storage',e=>{if(e.key===KEY){load();if($('#modal').classList.contains('hidden'))render()}});
setInterval(()=>{if(view==='team'&&T.user&&$('#modal').classList.contains('hidden'))render()},60000);
load();render();
</script>
</body>
</html>
